# Runs the same checks as `pnpm run ci` locally, on every pull request and
# every push to main, so a broken change can't be merged unnoticed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of date,
      # instead of quietly installing different versions.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # "pnpm run ci", not "pnpm ci": in pnpm, "ci" alone is a built-in
      # install command and would skip our checks entirely.
      - name: Type-check, lint, format check, test
        run: pnpm run ci
